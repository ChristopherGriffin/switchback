#==============================================================================
# SwitchBot Plug Mini (W1901400 / W1901401) - switchbota bootstrap payload
#==============================================================================
# This is the image switchbota writes over the stock firmware. It only has to
# get the plug onto Wi-Fi with the same API key and OTA password as the
# esphome-miniplug-framework configs, so the real config can follow over OTA.
#
# SIZE LIMIT:
#   The flasher writes from 0x0 and can only write WRITE_SIZE (0x171000 =
#   1,511,424 bytes), so firmware.factory.bin has to stay under that. That is
#   why there are no BLE components here. Add those in the real config.
#
# PARTITIONS:
#   This image also lays down the partition table the plug keeps from now on
#   (ESPHome default for 4MB: two 0x1C0000 app slots). OTA never changes it.
#
# REQUIRED SECRETS (same names as common/esp_common.yaml):
#   wifi_ssid, wifi_password, wifi_domain, api_encryption_key, ota_password
#
# BUILD:
#   esphome compile sbplug.yaml
#   copy .esphome/build/sbplug/.pioenvs/sbplug/firmware.factory.bin
#     to ../server/bin/payload.bin
#==============================================================================

esphome:
  name: sbplug
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_size: 4MB
  framework:
    type: esp-idf

# UART0 is what the serial pads expose, so boot logs show up on the recovery path
logger:
  hardware_uart: UART0

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: wpa2
  domain: !secret wifi_domain
  # Fallback hotspot so a plug with bad Wi-Fi details is not stranded in a welded case
  ap:

captive_portal:

switch:
  - platform: gpio
    name: "Relay"
    pin: GPIO6
    restore_mode: RESTORE_DEFAULT_OFF
