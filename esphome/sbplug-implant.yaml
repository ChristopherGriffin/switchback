#==============================================================================
# switchbota payload, implant variant
#==============================================================================
# The Wi-Fi name and password from secrets.yaml are built in, so the plug joins
# that network by itself and shows up on mDNS as sbplug-xxxxxx.
#
# If it cannot reach that network it falls back to the sbplug-xxxxxx hotspot,
# so a plug with wrong details is not stranded in a welded case.
#
# REQUIRED SECRETS: api_encryption_key, ota_password, wifi_ssid, wifi_password
# BUILD:            python tools/build_payload.py implant
#==============================================================================

packages:
  base: !include sbplug-base.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
